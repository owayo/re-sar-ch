# Rust の CLI の CI の標準の形に、sysstat との互換検査の conformance ジョブを足したもの。
#
# - quality: Linux と macOS で make setup と make ci だけを呼ぶ (検査の中身は Makefile の ci が決める)
# - conformance: 本家 sysstat のテストデータと sar / sadf を使う互換検査 (make conformance)
# - build: release.yml の build と同じ組 (os / target) でビルドする。release.yml の dry_run では build が
#   走らないので、配布物を作れることはここで確かめる。Windows はここでテストも回す
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows は入れない。ランナーの make は MinGW の mingw32-make の写しで、レシピの POSIX シェル前提
        # ($$(...) や [ -n ... ]) の解釈に癖がある。Windows のテストは build で cargo を直接呼ぶ
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ツールの版は mise.toml が正。mise 本体は公開から 14 日以上たった最新の版を、署名付きの checksum で
      # 確かめて入れる。cache は切る (効いた回だけ clippy / rustfmt が欠ける。jdx/mise-action#215)
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false

      # target/ と ~/.cargo のキャッシュ (鍵に rustc の版が入るので、mise.toml の rust を上げると作り直す)
      - uses: Swatinem/rust-cache@v2

      - run: make setup
      - run: make ci

  conformance:
    name: Conformance (vs upstream sysstat)
    needs: quality
    # ランナーの版を固定する。比較の基準は Ubuntu 24.04 の sysstat (12.6.1) で、ubuntu-latest は
    # 2026-10-19 から Ubuntu 26.04 (sysstat 12.7.7) へ移る。latest のままだと比較の基準が黙って変わり、
    # golden が壊れる (docs/format/04-test-data.md §7.1 / §7.4)。22.04 は非推奨なので足場にしない
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: Install sysstat (provides sar / sadf for cross-checking)
        # ランナーには sysstat が入っていないので必ず入れる。
        # sar が無いと、make conformance の sar を呼ぶテストはスキップと表示して通ってしまう。
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y sysstat libxml2-utils

      - name: Record sysstat version
        # 「どの版と比較したのか」を後から追えるようにテストレポートへ残す
        # (docs/format/04-test-data.md §7.4)。ランナーイメージの更新で
        # 比較基準が動いたことに気づけるようにするための記録である。
        run: |
          os_name=$(. /etc/os-release; echo "$PRETTY_NAME")
          sar_version=$(LC_ALL=C sar -V 2>&1 | head -1)
          sadf_version=$(LC_ALL=C sadf -V 2>&1 | head -1)
          pkg_version=$(dpkg-query -W -f='${Version}' sysstat)
          {
            echo '### Conformance environment'
            echo
            echo '| item | value |'
            echo '| --- | --- |'
            echo "| runner | ${os_name} (${{ runner.arch }}) |"
            echo "| sar | ${sar_version} |"
            echo "| sadf | ${sadf_version} |"
            echo "| sysstat package | ${pkg_version} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sysstat: ${sar_version} (package ${pkg_version}) on ${os_name}"

      - run: make setup

      - name: Run conformance tests
        # sysstat のテストデータは GPL のため本リポジトリには同梱せず、
        # make conformance が先に make fixtures で固定タグから取得する (SHA-256 照合つき)。
        # そのうえで conformance / sa2sar (sa to sar の CLI 出力) / detect_svg (SVG の窓と XML) の
        # ignored テストを回す。
        run: make conformance

  build:
    name: Build (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # release.yml の build と同じ組 (行を足したら両方に足す)。musl は glibc の古いディストリビューション向け
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # Windows のランナーは既定で LF を CRLF に変えて checkout する。release.yml の build と同じく LF のまま取り、
      # テストの期待値や include_str! で埋め込むスキルの本文の改行を配布物とそろえる
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ビルドに効く環境変数は mise.toml の [env] に置く。mise-action が後続のステップへ渡すので、
      # ci.yml と release.yml と手元の make で同じ値になる
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # mise.toml の rust はホストのツールチェーンと components だけを入れるので、配布のターゲットを足す
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # Windows は quality で make ci を回さないので、配る OS の裏付けとしてここでテストする
      # (Makefile の test と同じ --all-features を付ける)
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked --all-features

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
