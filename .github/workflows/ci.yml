name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  conformance:
    name: Conformance (vs upstream sysstat)
    needs: test
    # ubuntu-latest は使わない。現在は Ubuntu 24.04 (sysstat 12.6.1) を指すが、
    # 切り替え時期が告知されないまま 26.04 (sysstat 12.7.7) に移ると
    # 比較基準が無言で変わり golden が壊れる (docs/format/04-test-data.md §7.1 / §7.4)。
    # 22.04 は 2026-09-17 から非推奨開始なので足場にしない。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install sysstat (provides sar / sadf for cross-checking)
        # ランナーには sysstat はプリインストールされていないので必ず入れる。
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y sysstat

      - name: Record sysstat version
        # 「どの版と比較したのか」を後から追えるようにテストレポートへ残す
        # (docs/format/04-test-data.md §7.4)。ランナーイメージの更新で
        # 比較基準が動いたことに気づけるようにするための記録である。
        run: |
          os_name=$(. /etc/os-release; echo "$PRETTY_NAME")
          sar_version=$(LC_ALL=C sar -V 2>&1 | head -1)
          sadf_version=$(LC_ALL=C sadf -V 2>&1 | head -1)
          pkg_version=$(dpkg-query -W -f='${Version}' sysstat)
          {
            echo '### Conformance environment'
            echo
            echo '| item | value |'
            echo '| --- | --- |'
            echo "| runner | ${os_name} (${{ runner.arch }}) |"
            echo "| sar | ${sar_version} |"
            echo "| sadf | ${sadf_version} |"
            echo "| sysstat package | ${pkg_version} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sysstat: ${sar_version} (package ${pkg_version}) on ${os_name}"

      - name: Fetch upstream test fixtures
        # sysstat のテストデータは GPL のため本リポジトリには同梱せず、
        # CI 実行時に固定タグから取得する (SHA-256 照合つき)。
        run: cargo run --quiet --bin xtask -- fetch-fixtures

      - name: Run conformance tests
        run: cargo test --test conformance -- --include-ignored --nocapture

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
