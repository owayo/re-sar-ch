name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual release)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: resarch
  # mise 自身の版の正はここ (mise.toml には mise 自身を書けない)。ci.yml と同じ値にそろえる。
  # 公開から 14 日以上たった版を選ぶ。ツールの版は mise.toml が正
  MISE_VERSION: "2026.9.5"

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      # 版の書き換えは sed と git だけで行うので、ツールチェーンは入れない
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          # Use 2-digit year (YY) so the major version stays <= 255
          YEAR=$(date +%y)
          MONTH=$(date +%-m)

          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Current version: ${CURRENT}"

          if echo "${CURRENT}" | grep -qE '^[0-9]{2,4}\.[0-9]{1,2}\.[0-9]+$'; then
            OLD_YEAR=$(echo "${CURRENT}" | cut -d. -f1)
            OLD_MONTH=$(echo "${CURRENT}" | cut -d. -f2)
            OLD_COUNTER=$(echo "${CURRENT}" | cut -d. -f3)
            OLD_YEAR_2DIGIT=${OLD_YEAR#20}
            if [ "${OLD_YEAR_2DIGIT}" = "${YEAR}" ] && [ "${OLD_MONTH}" = "${MONTH}" ]; then
              NEW_COUNTER=$((OLD_COUNTER + 1))
            else
              NEW_COUNTER=100
            fi
          else
            NEW_COUNTER=100
          fi

          NEW_VERSION="${YEAR}.${MONTH}.${NEW_COUNTER}"
          echo "New version: ${NEW_VERSION}"

          # Only replace the first occurrence (package version, not dependency versions)
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"${NEW_VERSION}\"/" Cargo.toml

          # 自パッケージの version エントリだけを書き換える (依存ツリーは触らない)
          if [ -f "Cargo.lock" ]; then
            PKG_NAME=$(grep '^name = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
            sed -i "/^name = \"${PKG_NAME}\"$/{n;s/version = \"[^\"]*\"/version = \"${NEW_VERSION}\"/}" Cargo.lock
          fi

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        run: |
          git add Cargo.toml
          [ -f "Cargo.lock" ] && git add Cargo.lock || true

          git commit -m "Release ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin ${{ github.ref_name }} "${{ steps.bump.outputs.tag }}"

      - name: Dry run info
        if: ${{ inputs.dry_run }}
        run: |
          echo "🧪 Dry run mode - skipping commit and tag"
          echo "Would release: ${{ steps.bump.outputs.tag }}"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare-release
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: resarch
            asset_name: resarch-x86_64-unknown-linux-gnu.tar.gz
            cross: false
            tools: rust

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: resarch
            asset_name: resarch-x86_64-unknown-linux-musl.tar.gz
            cross: false
            tools: rust

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: resarch
            asset_name: resarch-aarch64-unknown-linux-gnu.tar.gz
            cross: true
            tools: rust cargo:https://github.com/cross-rs/cross

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: resarch
            asset_name: resarch-x86_64-apple-darwin.tar.gz
            cross: false
            tools: rust

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: resarch
            asset_name: resarch-aarch64-apple-darwin.tar.gz
            cross: false
            tools: rust

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: resarch.exe
            asset_name: resarch-x86_64-pc-windows-msvc.zip
            cross: false
            tools: rust

    steps:
      # Windows のランナーは既定で LF を CRLF に変えて checkout する。ci.yml の build と同じく
      # LF のまま取り出し、バイナリに埋め込むスキル本文 (include_str!) の改行を CI とそろえる
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      # Rust と cross の版は mise.toml で固定する (ci.yml の build と同じ)。ジョブに要るツールだけを入れる。
      # キャッシュは使わない。rust の実体は rustup が入れる (~/.rustup) のでキャッシュに入らず、
      # mise のキャッシュだけ戻すと component が欠けたまま進む (jdx/mise-action#215)
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ matrix.tools }}
          cache: false

      # mise が RUSTUP_TOOLCHAIN を mise.toml の版にするので、そのツールチェーンにターゲットを足す
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # ビルドは cross のコンテナの中で行う (コンテナにクロスのコンパイラがある)
      - name: Build with cross
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build
        if: "!matrix.cross"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: [prepare-release, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.tag }}
          body: |
            ## reSARch ${{ needs.prepare-release.outputs.version }}

            sysstat の sar バイナリ (sa ファイル) を sar / sadf に依存せず単体で解析する CLI

            ### 変更点

            バージョンは CalVer で、番号からは破壊的変更かどうかが読み取れない。
            **互換性を壊す変更は [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ needs.prepare-release.outputs.tag }}/CHANGELOG.md) の各版の先頭に「⚠️ 破壊的変更」として載せている。**
            更新前に確認すること。

            ### Installation

            #### Homebrew (macOS/Linux)
            ```bash
            brew install owayo/re-sar-ch/re-sar-ch
            ```

            #### Manual Download
            Download the appropriate binary for your platform and add it to your PATH.

            #### macOS (Apple Silicon)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}/resarch-aarch64-apple-darwin.tar.gz | tar xz
            sudo mv resarch /usr/local/bin/
            ```

            #### macOS (Intel)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}/resarch-x86_64-apple-darwin.tar.gz | tar xz
            sudo mv resarch /usr/local/bin/
            ```

            #### Linux (x86_64)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}/resarch-x86_64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv resarch /usr/local/bin/
            ```

            #### Linux (x86_64, static/musl)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}/resarch-x86_64-unknown-linux-musl.tar.gz | tar xz
            sudo mv resarch /usr/local/bin/
            ```

            #### Linux (ARM64)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}/resarch-aarch64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv resarch /usr/local/bin/
            ```

            #### Windows (winget)
            ```powershell
            winget install owayo.reSARch
            ```

            #### Windows (manual)
            Download `resarch-x86_64-pc-windows-msvc.zip`, extract, and add to PATH.

          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Tap
    needs: [prepare-release, release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-re-sar-ch
          permission-contents: write

      - name: Download release binaries and create bottles
        id: bottles
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          TAG="${{ needs.prepare-release.outputs.tag }}"
          REPO="${{ github.repository }}"

          # Source archive SHA256 for platforms without a bottle.
          curl --fail --silent --show-error --location \
            "https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz" \
            --output source.tar.gz
          SHA256_SOURCE=$(sha256sum source.tar.gz | cut -d' ' -f1)

          # Release binaries used to assemble Homebrew bottle directory layouts.
          curl --fail --silent --show-error --location \
            "https://github.com/${REPO}/releases/download/${TAG}/resarch-aarch64-apple-darwin.tar.gz" \
            --output mac_arm64.tar.gz
          curl --fail --silent --show-error --location \
            "https://github.com/${REPO}/releases/download/${TAG}/resarch-x86_64-apple-darwin.tar.gz" \
            --output mac_x86_64.tar.gz
          curl --fail --silent --show-error --location \
            "https://github.com/${REPO}/releases/download/${TAG}/resarch-x86_64-unknown-linux-gnu.tar.gz" \
            --output linux_x86_64.tar.gz

          create_bottle() {
            local src_tarball=$1
            local bottle_tag=$2
            rm -rf bottle_staging
            mkdir -p "bottle_staging/re-sar-ch/${VERSION}/bin"
            tar xzf "${src_tarball}" -C "bottle_staging/re-sar-ch/${VERSION}/bin/"
            test -f "bottle_staging/re-sar-ch/${VERSION}/bin/resarch"
            chmod +x "bottle_staging/re-sar-ch/${VERSION}/bin/resarch"
            local bottle_name="re-sar-ch-${VERSION}.${bottle_tag}.bottle.tar.gz"
            # Keep tar quiet: verbose output would corrupt the captured SHA256 value.
            tar czf "${bottle_name}" -C bottle_staging re-sar-ch
            sha256sum "${bottle_name}" | cut -d' ' -f1
          }

          SHA256_ARM64=$(create_bottle mac_arm64.tar.gz arm64_sonoma)
          SHA256_INTEL=$(create_bottle mac_x86_64.tar.gz sonoma)
          SHA256_LINUX=$(create_bottle linux_x86_64.tar.gz x86_64_linux)

          {
            echo "sha256_source=${SHA256_SOURCE}"
            echo "sha256_arm64=${SHA256_ARM64}"
            echo "sha256_intel=${SHA256_INTEL}"
            echo "sha256_linux=${SHA256_LINUX}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload bottles to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          gh release upload "${TAG}" ./*.bottle.tar.gz --clobber --repo "${{ github.repository }}"

      - name: Update Homebrew Formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          TAG="${{ needs.prepare-release.outputs.tag }}"
          SHA256_SOURCE="${{ steps.bottles.outputs.sha256_source }}"
          SHA256_ARM64="${{ steps.bottles.outputs.sha256_arm64 }}"
          SHA256_INTEL="${{ steps.bottles.outputs.sha256_intel }}"
          SHA256_LINUX="${{ steps.bottles.outputs.sha256_linux }}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/owayo/homebrew-re-sar-ch.git"
          cd homebrew-re-sar-ch
          mkdir -p Formula

          cat > Formula/re-sar-ch.rb << 'FORMULA'
          class ReSarCh < Formula
            desc "Standalone parser for sysstat sar binary data files"
            homepage "https://github.com/owayo/re-sar-ch"
            url "https://github.com/owayo/re-sar-ch/archive/refs/tags/vVERSION_PLACEHOLDER.tar.gz"
            sha256 "SOURCE_SHA256_PLACEHOLDER"
            license "MIT"

            bottle do
              root_url "https://github.com/owayo/re-sar-ch/releases/download/vVERSION_PLACEHOLDER"
              sha256 cellar: :any_skip_relocation, arm64_sonoma: "ARM64_SHA256_PLACEHOLDER"
              sha256 cellar: :any_skip_relocation, sonoma: "INTEL_SHA256_PLACEHOLDER"
              sha256 cellar: :any_skip_relocation, x86_64_linux: "LINUX_SHA256_PLACEHOLDER"
            end

            depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args, "--bin", "resarch"
            end

            test do
              system "#{bin}/resarch", "--version"
            end
          end
          FORMULA

          sed -i "s|VERSION_PLACEHOLDER|${VERSION}|g" Formula/re-sar-ch.rb
          sed -i "s|SOURCE_SHA256_PLACEHOLDER|${SHA256_SOURCE}|g" Formula/re-sar-ch.rb
          sed -i "s|ARM64_SHA256_PLACEHOLDER|${SHA256_ARM64}|g" Formula/re-sar-ch.rb
          sed -i "s|INTEL_SHA256_PLACEHOLDER|${SHA256_INTEL}|g" Formula/re-sar-ch.rb
          sed -i "s|LINUX_SHA256_PLACEHOLDER|${SHA256_LINUX}|g" Formula/re-sar-ch.rb
          sed -i 's/^          //' Formula/re-sar-ch.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/re-sar-ch.rb
          git commit -m "Update re-sar-ch to ${TAG}"
          git push

  publish-winget:
    name: Publish to WinGet
    needs: [prepare-release, release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      WINGET_IDENTIFIER: owayo.reSARch
    steps:
      # winget-pkgs への提出は任意。WINGET_TOKEN 未設定でもリリース全体を失敗させない。
      # 必要な準備 (1 回だけ):
      #   1. owayo アカウントで microsoft/winget-pkgs を fork する
      #   2. classic PAT (scope: public_repo) を作り、secrets.WINGET_TOKEN に登録する
      #      (fine-grained PAT はこの Action では使えない)
      #   3. komac / wingetcreate で owayo.reSARch の初版マニフェストを手動提出する
      #      (winget-releaser は既存パッケージの「更新」しかできない)
      - name: Check WinGet token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "${WINGET_TOKEN}" ]; then
            echo "::warning::WINGET_TOKEN is not set; skipping winget-pkgs submission"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # 初版マニフェストが winget-pkgs にマージされるまでは、winget-releaser が
      # "Package ... does not exist in the winget-pkgs repository" で必ず exit 1 する。
      # 審査待ちは異常ではないので、ここで登録の有無を確かめてステップごと飛ばす
      # (リリース全体を失敗させない)。マージされた次のリリースから提出が自動で再開する。
      - name: Check winget-pkgs registration
        id: registration
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # winget-releaser と同じ判定パス: manifests/<頭文字小文字>/<Publisher>/<Package>
          INITIAL=$(printf '%s' "${WINGET_IDENTIFIER}" | cut -c1 | tr '[:upper:]' '[:lower:]')
          MANIFEST_DIR="manifests/${INITIAL}/${WINGET_IDENTIFIER//.//}"

          http_status() {
            curl --silent --output /dev/null --write-out '%{http_code}' "$@" || true
          }

          STATUS=$(http_status \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/microsoft/winget-pkgs/contents/${MANIFEST_DIR}")

          # API が使えないとき (rate limit 等) は winget-releaser と同じ web パスで確かめ直す
          if [ "${STATUS}" != "200" ] && [ "${STATUS}" != "404" ]; then
            echo "GitHub API returned HTTP ${STATUS}; retrying with the web path"
            STATUS=$(http_status "https://github.com/microsoft/winget-pkgs/tree/master/${MANIFEST_DIR}")
          fi
          echo "HTTP ${STATUS}: ${MANIFEST_DIR}"

          case "${STATUS}" in
            200)
              echo "registered=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "::notice::${WINGET_IDENTIFIER} is not in winget-pkgs yet (the initial manifest PR is still awaiting review); skipping winget-pkgs submission"
              echo "registered=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # 判定できなかったときは提出を試す (本当に出せなければ action 側が失敗する)
              echo "::warning::Could not determine winget-pkgs registration (HTTP ${STATUS}); attempting submission anyway"
              echo "registered=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # 既定の installers-regex は exe/msi/msix/appx しか拾わないため、
      # zip 配布の reSARch では明示的に Windows 用 zip を指定する
      - name: Submit manifest to winget-pkgs
        if: steps.token.outputs.available == 'true' && steps.registration.outputs.registered == 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: ${{ env.WINGET_IDENTIFIER }}
          version: ${{ needs.prepare-release.outputs.version }}
          release-tag: ${{ needs.prepare-release.outputs.tag }}
          installers-regex: '-pc-windows-msvc\.zip$'
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}

  release-summary:
    name: Release Summary
    needs: [prepare-release, release, update-homebrew, publish-winget]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "🚀 Released ${{ needs.prepare-release.outputs.tag }}"
          echo ""
          echo "Assets uploaded:"
          echo "  - resarch-x86_64-unknown-linux-gnu.tar.gz"
          echo "  - resarch-x86_64-unknown-linux-musl.tar.gz"
          echo "  - resarch-aarch64-unknown-linux-gnu.tar.gz"
          echo "  - resarch-x86_64-apple-darwin.tar.gz"
          echo "  - resarch-aarch64-apple-darwin.tar.gz"
          echo "  - resarch-x86_64-pc-windows-msvc.zip"
          echo ""
          echo "🍺 Homebrew tap updated: owayo/homebrew-re-sar-ch"
          echo "📦 WinGet manifest PR submitted: owayo.reSARch"
          echo "   (skipped if WINGET_TOKEN is unset, or the package is not in winget-pkgs yet)"
