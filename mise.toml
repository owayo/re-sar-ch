# このリポジトリのツールチェーン。ローカルと CI の両方がここを正とする。
# 開発のコマンドは make 経由で呼ぶ (Makefile が mise exec -- を付ける。初回は make setup)。
#
# mise 自身の版は mise.toml に書けないので固定しない。CI は mise-action の minimum_release_age (14d) で、
# 公開から 14 日以上たった最新の版を入れる。
# mise で入れないものは OS のものを使う: jq・curl・shasum と Apple container か Docker
# (make sar-* の採取)、xmllint と sysstat の sar (make conformance の一部のテスト)。

[tools]
# components を明示する。未指定だと rustup の既定の profile しだいで入るものが変わり、
# GitHub Actions のランナーでは cargo fmt / cargo clippy が無いと言われて落ちる。
# 配布物のターゲット (aarch64 Linux を含む) は CI と Release のジョブが各 OS のランナーで
# rustup target add してそのままビルドするので、クロスビルドの道具は要らない
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"] }
